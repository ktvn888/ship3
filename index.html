<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay tài xế Pro</title>
<style>
/* ===== Màu sắc (sáng/tối) ===== */
:root{--bg:#eef2f0;--card:#fff;--tx:#14201a;--mu:#62736a;--ln:#d9e2dd;--ac:#00985a;--ac2:#d9f3e6;--wa:#d97706;--er:#d33a3a;--ok:#0b8a4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0f1613;--card:#18211d;--tx:#e8f0ec;--mu:#8fa398;--ln:#28352f;--ac:#2fd08a;--ac2:#163a29;--wa:#f0a53a;--er:#ff6b6b;--ok:#2fd08a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1613;--card:#18211d;--tx:#e8f0ec;--mu:#8fa398;--ln:#28352f;--ac:#2fd08a;--ac2:#163a29;--wa:#f0a53a;--er:#ff6b6b;--ok:#2fd08a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px}
h2{font-size:18px;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--er)}.warn{color:var(--wa)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:48px;padding:0 16px;background:var(--ac2);color:var(--ac);cursor:pointer}
button.p{background:var(--ac);color:#fff}[data-theme=dark] button.p{color:#06140d}
button.d{background:transparent;color:var(--er);border:1px solid var(--er)}
button.s{min-height:38px;padding:0 12px;font-size:14px}
button.f{flex:1}
input,select{font:inherit;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:0 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 2px 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 40%;background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}[data-theme=dark] .seg button.on{color:#06140d}
.row>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;padding:0 8px;font-size:15px;-webkit-appearance:none;appearance:none;text-align:left}
.seg.t3 button{flex:1 1 0;min-width:0;padding:0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.chips button{min-height:36px;font-size:13px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border-radius:0;background:none;color:var(--mu);min-height:62px;font-size:12px}nav button.on{color:var(--ac)}
nav span{display:block;font-size:20px}
.bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;min-height:58px;border-radius:30px;padding:0 22px;box-shadow:0 4px 14px #0004;font-size:17px}
.trip{border-left:5px solid var(--ac)}.trip.run{border-color:var(--wa)}.trip.cancel{border-color:var(--mu);opacity:.65}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cw{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.cc{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.cb{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--ln);background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/100% 50%}
.cb i{display:block;width:70%;background:var(--ac);border-radius:6px 6px 0 0}
.cv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.cd{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.sw input{width:26px;min-height:26px}
.den{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.dc{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:4px}
.dc b{width:40px;font-size:14px;padding-left:4px}
.dc input{min-height:38px;padding:0 2px;text-align:center;flex:1;min-width:0}
.dc button{padding:0;width:34px;flex:none}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--ac)}

:root{--bg:#f1f5f2;--card:#fff;--tx:#14271f;--mu:#52665c;--ln:#dce7e0;--ac:#00784b;--ac2:#e0f3e7}
body{font-family:system-ui,sans-serif;padding-bottom:155px}
main,.app-header{max-width:680px;margin:auto;padding-inline:16px}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:19px 4px}
.app-title{display:flex;align-items:center;gap:10px}
.app-title h1{font-size:clamp(18px,5vw,23px);margin:0;letter-spacing:-.04em}
.brand{background:#093d2d;color:#9dffcc;display:grid;place-items:center;width:37px;height:37px;border-radius:12px}
.card{border-radius:19px;padding:16px}
.shift-card{background:linear-gradient(120deg,#07382b,#106044);color:#fff;border:0;padding:19px}
.shift-card .mu{color:#bddecd}.shift-card .p{background:#a0f4bd;color:#083929}
.shift-card .d{color:#fff;border-color:#c4e5d3}
.shift-money{font-size:clamp(29px,8vw,47px);letter-spacing:-.04em;font-weight:750}
.shift-meta{display:flex;flex-wrap:wrap;gap:4px 15px;margin-bottom:12px}
.dash-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.weekly h2{margin:0}.weekly .big{font-size:27px}
.weekly .seg{margin:12px 0 10px}
.weekly .seg button{display:grid;align-content:center;gap:2px;min-height:58px}
.weekly .seg small{font-size:11px;font-weight:500}
.kpis{margin:10px 0}.kpis .big{font-size:clamp(18px,5vw,26px);overflow-wrap:anywhere}
.dash-bottom{margin-top:12px}
nav{max-width:680px;margin:auto}
nav button{padding-inline:4px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.fab{right:max(16px,calc((100vw - 648px)/2))}

.icon-defs{position:absolute;pointer-events:none}
.ui-icon{width:1.2em;height:1.2em;vertical-align:-.24em;flex:none}
.brand .ui-icon{width:21px;height:21px}
.app-profile{display:flex;align-items:center;gap:8px;flex:none}
.driver-avatar{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--ln);border-radius:50%;color:var(--ac);background:var(--ac2);font-size:15px;font-weight:750}
nav .ui-icon{display:block;width:22px;height:22px;margin:0 auto 3px}
.weekly h2 .ui-icon{color:var(--ac)}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" class="icon-defs" aria-hidden="true"><symbol id="icon-route" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8a4 4 0 0 1 0 8H8a2 2 0 0 0 0 4h8"/></symbol><symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/></symbol><symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v10H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2l13-2"/><path d="M21 12h-5a2 2 0 0 0 0 4h5"/></symbol><symbol id="icon-stats" viewBox="0 0 24 24"><path d="M4 4v16h16M9 15v-3m5 3V8m5 7V5"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--card)"/><circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="9" cy="17" r="2" fill="var(--card)"/></symbol><symbol id="icon-cash" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></symbol><symbol id="icon-expense" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6m-6 4h6"/></symbol><symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 3h8v6a4 4 0 0 1-8 0zM8 5H4v3a3 3 0 0 0 4 3m8-6h4v3a3 3 0 0 1-4 3m-4 2v7m-4 0h8"/></symbol><symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol></svg>
<header class="app-header"><div class="app-title"><span class="brand" aria-hidden="true"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-route"/></svg></span><h1>Sổ tay tài xế Pro</h1></div><div class="app-profile"><span class="mu" id="appDate"></span><span class="driver-avatar" aria-label="Trung" role="img">T</span></div></header>
<main id="app"></main>
<button class="p fab" id="fab" onclick="tripForm()"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-plus"/></svg> Thêm cuốc</button>
<nav id="nav"></nav>
<script>
/* ================= DỮ LIỆU ================= */
const K='grab_tinh_tien_v1';
const TYPES={bike:'Grab Bike',food:'Grab Food',mart:'Grab Mart',express:'Grab Express',ngoai:'Cuốc ngoài'};
const PAYS={cash:'Tiền mặt',bank:'Chuyển khoản',split:'Nửa tiền mặt, nửa CK',card:'Thẻ/Ví điện tử'};
const STAT={run:'Đang chạy',done:'Hoàn thành',cancel:'Huỷ'};
const def=()=>({trips:[],exps:[],credit:{bal:0,log:[]},driver:{bal:0,log:[]},shift:null,shifts:[],counts:[],seq:0,
 set:{goal:1000000,weekGoal:70,bikeRate:20,cashFee:true,cashNet:true,keepAwake:false,theme:''}});
let S=load(),tab='home',wsel='credit',F={from:'',to:'',type:'',pay:'',range:'day'};
function load(){try{const d=def(),x=JSON.parse(localStorage.getItem(K)||'{}');return{...d,...x,set:{...d.set,...(x.set||{})}}}catch(e){return def()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu!')}}

/* ================= TIỆN ÍCH ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+Math.abs(Math.round(n||0)).toLocaleString('vi-VN')+'đ';
/* Đọc số từ ô nhập: bỏ dấu chấm ngăn cách hàng nghìn ("1.000" -> 1000) */
const val=v=>typeof v==='number'?v:(parseFloat(String(v??'').replace(/\./g,''))||0);
const num=v=>Math.max(0,Math.round(val(v)));
const fmt=n=>n?Math.round(n).toLocaleString('vi-VN'):''; // số -> chuỗi có dấu chấm, để điền vào ô nhập
/* Ô nhập tiền (class "mi"): vừa gõ vừa định dạng 1.000, giữ nguyên vị trí con trỏ. data-neg cho phép số âm */
function fmtInput(el){
 const neg=el.dataset.neg&&el.value.trim().startsWith('-');
 const caret=el.selectionStart??el.value.length;
 const before=el.value.slice(0,caret).replace(/\D/g,'').length;
 const digits=el.value.replace(/\D/g,'').slice(0,12);
 let out=digits?Number(digits).toLocaleString('vi-VN'):'';if(neg)out='-'+out;
 el.value=out;
 let c=0,i=neg?1:0;for(;i<out.length&&c<before;i++){if(/\d/.test(out[i]))c++}
 try{el.setSelectionRange(i,i)}catch(_){}}
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('mi'))fmtInput(e.target)},true); // capture: chạy trước các oninput khác
const dkey=ts=>new Date(ts).toLocaleDateString('sv-SE');
const tripTime=ts=>new Date(ts).toTimeString().slice(0,5);
function tripDateOffset(days){
 const date=new Date();
 date.setDate(date.getDate()+days);
 $('fDate').value=dkey(date);
}
function readTripTimestamp(){
 const date=$('fDate').value,time=$('fTime').value;
 if(!date||!time)return null;
 const candidate=new Date(date+'T'+time);
 if(!Number.isFinite(+candidate)||dkey(candidate)!==date||tripTime(candidate)!==time)return null;
 return date===dkey(f.ts)&&time===tripTime(f.ts)?f.ts:+candidate;
}
const tm=ts=>new Date(ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const dt=ts=>new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const short=v=>v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+'tr':Math.round(v/1000)+'k';
const inc=t=>t.net+(t.bonus||0)+(t.tip||0)+(t.tipOut||0); // thu nhập 1 cuốc = ròng + thưởng + tip
const cls=n=>n>0?'pos':n<0?'neg':'';
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
window.alert=m=>toast(m);
function ask(msg,yes,ok){const e=document.createElement('div');e.className='sheet';e.style.zIndex=40;
 e.innerHTML='<div class="box"><p style="font-size:17px">'+esc(msg)+'</p><div class="row"><button class="f">Huỷ</button><button class="p f">'+(ok||'Đồng ý')+'</button></div></div>';
 document.body.append(e);const b=e.querySelectorAll('button');b[0].onclick=()=>e.remove();b[1].onclick=()=>{e.remove();yes()}}
function sheet(h){closeSheet();const e=document.createElement('div');e.className='sheet';e.id='sheet';e.innerHTML='<div class="box">'+h+'</div>';
 e.onclick=ev=>{if(ev.target===e)closeSheet()};document.body.append(e)}
function closeSheet(){const e=$('sheet');if(e)e.remove()}
/* Biến động ví: cộng/trừ và ghi lịch sử */
function adj(w,amt,why){if(!amt)return;S[w].bal+=amt;S[w].log.unshift({ts:Date.now(),why,amt,bal:S[w].bal})}

/* ================= LOGIC VÍ & CUỐC ================= */
/* Ảnh hưởng ví của 1 cuốc: chỉ khi Hoàn thành và không phải cuốc ngoài */
function fx(t){
 if(t.status!=='done'||t.type==='ngoai')return{c:0,d:0};
 /* Nhóm đơn Food: ví tín dụng trừ tổng phải thu của các đơn tiền mặt/chuyển khoản; ví tài xế cộng tổng ròng của cả nhóm */
 if(t.subs)return{c:S.set.cashFee?-t.subs.filter(x=>x.pay!=='card').reduce((a,x)=>a+x.due,0):0,d:t.net+(t.bonus||0)};
 const fee=t.due-t.net, cashLike=t.pay!=='card';
 const r=cashLike?{c:S.set.cashFee?-t.due:0,d:S.set.cashNet?t.net:0} /* tiền mặt/chuyển khoản: ví tín dụng trừ đúng số tiền phải thu; phần chênh lệch chỉ để xem % */:{c:0,d:t.net};
 r.d+=(t.bonus||0)+(t.pay==='card'?t.tip||0:0);return r; // thưởng cuốc luôn cộng vào ví tài xế
}
const tname=t=>TYPES[t.type]+' #'+t.no;
/* Hoàn tác phần đã áp lên ví, rồi áp lại theo dữ liệu mới */
function revert(t,why){if(t.applied){adj('credit',-t.applied.c,why+' '+tname(t));adj('driver',-t.applied.d,why+' '+tname(t));t.applied=null}}
let lastShort=0; // số tiền ví tín dụng thiếu của lần áp ví gần nhất (để báo cho người dùng)
function applyTrip(t){const f=fx(t);
 /* Ví tín dụng không đủ thì phần thiếu được trích từ ví tài xế */
 const short=Math.max(0,-f.c-Math.max(0,S.credit.bal));lastShort=short;
 adj('credit',f.c+short,'Trừ tiền phải thu '+tname(t)+(short?' (phần thiếu trích ví tài xế)':''));
 const tw=t.pay==='card'?t.tip||0:0;adj('driver',f.d-(t.bonus||0)-tw,'Tiền ròng '+tname(t));adj('driver',t.bonus||0,'Thưởng '+tname(t));adj('driver',tw,'Tip '+tname(t));
 adj('driver',-short,'Bù thiếu ví tín dụng '+tname(t));
 t.applied={c:f.c+short,d:f.d-short}}
/* Kiểm tra ví tín dụng có đủ không trước khi áp */
function creditOk(t,old,go){
 const n=fx(t),avail=Math.max(0,S.credit.bal-(old&&old.applied?old.applied.c:0)),short=Math.max(0,-n.c-avail);
 if(!short)return go();
 /* Phần thiếu trích từ ví tài xế; chỉ hỏi khi ví tài xế cũng không đủ */
 const drv=S.driver.bal-(old&&old.applied?old.applied.d:0)+n.d-short;
 if(drv>=0)go();else ask('Ví tín dụng thiếu '+money(short)+' và ví tài xế cũng không đủ (sau cuốc này còn '+money(drv)+'). Vẫn tiếp tục?',go)}
function cashOf(t){ // tiền mặt vào két của 1 cuốc hoàn thành
 if(t.subs&&t.status==='done'){let i=0,o=0;t.subs.forEach(x=>{if(x.pay==='cash'){const g=x.given||x.due;i+=g;o+=g-x.due}else if(x.pay==='split'){const s=splitOf(x);i+=s.c;o+=s.ch}});return{in:i+(t.tipOut||0),out:o}}
 if(t.status!=='done')return{in:0,out:0};
 if(t.pay==='split'){const s=splitOf(t,t.tip);return{in:s.c+(t.tipOut||0),out:s.ch}} // nửa tiền mặt: chỉ phần tiền mặt vào két
 if(t.pay!=='cash')return{in:t.tipOut||0,out:0}; // thẻ/ví/chuyển khoản: chỉ có tip ngoài là tiền mặt
 const tp=t.tip||0,g=t.type==='ngoai'?t.due:(t.given||t.due+tp);return{in:g+(t.tipOut||0),out:g-t.due-tp}}

/* Chia đôi tiền mặt / chuyển khoản: c = tiền mặt khách đưa, b = khách chuyển khoản, ch = tiền trả lại khách (bằng tiền mặt) */
function splitOf(x,tip){const c=x.cashPart||0,b=x.bankPart||0;return{c,b,ch:Math.max(0,c+b-x.due-(tip||0))}}
/* Chênh lệch phải thu - ròng. Ròng có thể lớn hơn phải thu (khách dùng voucher, Grab bù) */
function feeInfo(due,net,bike){const fee=due-net;
 if(bike){
  if(fee<0)return `Grab bù thêm: <b>${money(-fee)}</b> (ròng cao hơn phải thu, vd voucher)<br>Bạn nhận: <b>${money(net)}</b>`;
  return `Grab lấy: <b>${money(fee)}</b>${due?` (${(fee/due*100).toFixed(1)}%)`:''}<br>Bạn nhận: <b>${money(net)}</b>${due?` (${(net/due*100).toFixed(1)}%)`:''}`}
 return fee<0?`Chênh lệch: <b>+${money(-fee)}</b> (ròng cao hơn phải thu)`:`Chênh lệch: <b>${money(fee)}</b>`}

/* ===== Đếm mệnh giá tiền mặt =====
   DV[key] = {mệnhgiá: số tờ}. key: 'open' (đầu ca), 'in' (khách đưa), 'out' (trả lại), 'exp' (chi phí), 'end' (cuối ca) */
const DENS=[500000,200000,100000,50000,20000,10000,5000,2000,1000];
const DV={},DCB={};
const dlab=d=>d>=1000?(d/1000)+'k':String(d);
const denSum=o=>Object.entries(o||{}).reduce((a,[d,n])=>a+Number(d)*n,0);
function denHtml(key,vals,cb){DV[key]={...(vals||{})};DCB[key]=cb;

 return '<br>Đếm mệnh giá: '+t.join(' · ')}

function saveTrip(id){
 const ts=readTripTimestamp();
 if(ts===null)return toast('Anh chọn ngày và giờ chạy hợp lệ.');
 if(ts>Date.now())return toast('Ngày giờ chạy phải từ hiện tại trở về trước.');
 const ng=f.type==='ngoai',isG=f.isG,due=f.dueV,net=f.netV,g=f.givenV,sp=f.pay==='split'&&!isG;
 /* Cuốc ngoài cần số tiền; cuốc app có thể có phải thu = 0 (voucher) và ròng bất kỳ, ròng được phép lớn hơn phải thu */
 if(ng?!due:(!due&&!net))return alert('Hãy nhập số tiền.');
 if(isG){if(!f.subs.length)return alert('Cần ít nhất 1 đơn.');
  if(f.subs.some(x=>x.pay==='cash'&&num(x.given)&&num(x.given)<num(x.due)))return alert('Có đơn tiền mặt khách đưa chưa đủ.');
  if(f.subs.some(x=>x.pay==='bank'&&num(x.given)&&num(x.given)<num(x.due)))return alert('Có đơn chuyển khoản khách chuyển chưa đủ.');
  if(f.subs.some(x=>x.pay==='split'&&num(x.cashPart)+num(x.bankPart)<num(x.due)))return alert('Có đơn nửa tiền mặt nửa CK khách trả chưa đủ.')}
 if(sp&&f.cashV+f.bankV<due+f.tipV)return alert('Khách trả (tiền mặt + chuyển khoản) chưa đủ tiền phải thu + tip.');
 if(!ng&&!isG&&f.pay==='cash'&&g&&g<due+f.tipV)return alert('Khách đưa chưa đủ tiền phải thu + tip.');
 if(!ng&&!isG&&f.pay==='bank'&&g&&g<due)return alert('Khách chuyển chưa đủ tiền phải thu.');
 const old=S.trips.find(t=>t.id===id);
 const t={id:old?old.id:Date.now(),no:old?old.no:++S.seq,type:f.type,pay:isG?'mixed':f.pay,subs:isG?f.subs.map(x=>({kind:x.kind||f.type,due:num(x.due),pay:x.pay,given:(x.pay==='cash'||x.pay==='bank')?num(x.given):0,cashPart:x.pay==='split'?num(x.cashPart):0,bankPart:x.pay==='split'?num(x.bankPart):0})):undefined,status:f.status,due,net,given:(!ng&&(f.pay==='cash'||f.pay==='bank'))?g:0,cashPart:sp?f.cashV:(ng&&f.pay==='split'?f.cashV:0),bankPart:f.pay==='split'?f.bankV:0,tip:f.tipV,
  bonus:ng?0:f.bonusV,tipOut:ng?0:f.tipOutV,denIn:($('fDen').style.display!=='none'&&denSum(DV['in']))?{...DV['in']}:undefined,denOut:($('fDen').style.display!=='none'&&denSum(DV.out))?{...DV.out}:undefined,note:$('fNote').value.trim(),ts,applied:old?old.applied:null};
 const commit=()=>{
  const i=S.trips.findIndex(x=>x.id===t.id);if(i>=0)S.trips[i]=t;else S.trips.push(t);
  const day=dkey(ts);
  if(old?dkey(old.ts)!==day:day!==dkey(Date.now())){
   tab='stats';F={from:day,to:day,type:'',pay:'',range:'day'};
  }
  save();closeSheet();render();toast('Đã lưu cuốc'+(lastShort?'. Ví tín dụng thiếu '+money(lastShort)+', đã trích từ ví tài xế':''));
 };
 if(old){
  const before=fx(old),after=fx(t);
  if(before.c===after.c&&before.d===after.d&&(old.bonus||0)===(t.bonus||0)&&(old.tip||0)===(t.tip||0)&&old.pay===t.pay){
   lastShort=0;commit();return;
  }

}

/* ================= CA LÀM VIỆC ================= */
function shiftCalc(sh){
 const inR=x=>x.ts>=sh.start&&(!sh.end||x.ts<=sh.end);
 const tr=S.trips.filter(t=>inR(t)&&t.status==='done'),ex=S.exps.filter(inR);
 let ci=0,co=0,cashTrips=0,withDen=0;const den={...(sh.openDen||{})};
 tr.forEach(t=>{const c=cashOf(t);ci+=c.in;co+=c.out;
  if(c.in||c.out){cashTrips++;if(denSum(t.denIn)||denSum(t.denOut))withDen++}
  for(const d in (t.denIn||{}))den[d]=(den[d]||0)+t.denIn[d];
  for(const d in (t.denOut||{}))den[d]=(den[d]||0)-t.denOut[d]});
 ex.forEach(e=>{for(const d in (e.denOut||{}))den[d]=(den[d]||0)-e.denOut[d]});
 const ce=ex.filter(e=>e.cash).reduce((a,e)=>a+e.amt,0),all=ex.reduce((a,e)=>a+e.amt,0);
 const net=tr.reduce((a,t)=>a+inc(t),0);
 return{n:tr.length,net,ci,co,ce,all,exp:sh.open+ci-co-ce,profit:net-all,expDen:den,cashTrips,withDen,hasOpenDen:!!denSum(sh.openDen)}}
function startShift(){
 if(S.shift)return;
 sheet(`<form id="sStartForm"><h2 style="margin-top:0">Bắt đầu ca</h2>
 <label for="sOpen">Tiền mặt đầu ca (để trống nếu 0đ)</label><input id="sOpen" type="text" inputmode="numeric" class="mi" placeholder="0">
 <details style="margin-top:8px"><summary>Đếm theo mệnh giá (tuỳ chọn, để đối soát cuối ca)</summary>${denHtml('open',{},()=>{$('sOpen').value=fmt(denSum(DV.open))})}</details>
 <div class="row" style="margin-top:14px"><button type="button" class="f" id="sClose">Đóng</button><button type="submit" class="p f">Bắt đầu</button></div></form>`);
 denTot('open');
 $('sClose').addEventListener('click',closeSheet);
 $('sStartForm').addEventListener('submit',event=>{
  event.preventDefault();
  if(S.shift)return;
  const open=num($('sOpen').value);
  const counted=denSum(DV.open);
  if(counted&&counted!==open)return toast('Tiền đầu ca và tổng mệnh giá đang lệch.');
  S.shift={start:Date.now(),open,openDen:{...DV.open}};
  save();closeSheet();render();toast('Đã bắt đầu ca');
 });
}
function endShift(){const c=shiftCalc(S.shift);
 sheet(`<h2 style="margin-top:0">Kết thúc ca</h2><div class="card">Số cuốc hoàn thành: <b>${c.n}</b><br>Tổng thực nhận: <b>${money(c.net)}</b><br>Chi phí: <b>${money(c.all)}</b><br>Lợi nhuận: <b class="${cls(c.profit)}">${money(c.profit)}</b><br><br>
 Đầu ca: ${money(S.shift.open)}<br>+ Tiền mặt thu: ${money(c.ci)}<br>− Trả lại khách: ${money(c.co)}<br>− Chi tiền mặt: ${money(c.ce)}<br>= Dự kiến cuối ca: <b>${money(c.exp)}</b></div>
 <details open style="margin-top:8px"><summary>Đếm tiền cuối ca để đối soát kết ca</summary>${denHtml('end',{},endChk)}<div id="sDen" style="margin-top:8px"></div></details>
 <label>Tiền mặt thực tế cuối ca (tự điền khi bạn đếm mệnh giá)</label><input id="sAct" type="text" inputmode="numeric" class="mi" oninput="endDiff(${c.exp})">
 <p id="sDiff"></p><div class="row"><button class="f" onclick="closeSheet()">Đóng</button><button class="p f" onclick="doEnd(${c.exp})">Kết thúc ca</button></div>`);E_C=c;denTot('end');endChk()}
let E_C=null;
function endDiff(exp){const v=$('sAct').value,d=num(v)-exp;$('sDiff').innerHTML=v===''?'':(d>=0?'Thừa ':'Thiếu ')+money(Math.abs(d));$('sDiff').className=d<0?'neg':'pos'}
/* Đối soát cuối ca: so số tờ dự kiến (đầu ca + khách đưa − trả lại − chi) với số tờ đếm được */
/* Các dòng so sánh số tờ dự kiến / đếm được của từng mệnh giá (dùng cho kết ca và đếm thực tế) */
function denRows(expDen,a){return DENS.filter(d=>(expDen[d]||0)||(a[d]||0)).map(d=>{const e=expDen[d]||0,n=a[d]||0,x=n-e;
  return `<div class="row sp"><span>${dlab(d)}: dự kiến <b>${e}</b> · đếm <b>${n}</b></span><b class="${x<0?'neg':x>0?'pos':''}">${x===0?'khớp':(x>0?'thừa ':'thiếu ')+Math.abs(x)+' tờ'}</b></div>`}).join('')}
/* ===== Đếm tiền mặt thực tế (bấm bất cứ lúc nào, không cần kết ca) ===== */

 <div class="mu">${c?'Ca đang chạy: dự kiến trong két '+money(c.exp)+'. Đếm xong sẽ so sánh ngay, không kết ca.':'Chưa bắt đầu ca nên chỉ đếm và lưu, không đối soát.'}</div>

 denTot('cnt');cntChk()}
function cntChk(){const a=DV.cnt,sum=denSum(a),c=E_C2;if(!$('cRes'))return;let h='';
 if(c){const d=sum-c.exp;h+=`<div class="row sp"><span>Dự kiến trong két</span><b>${money(c.exp)}</b></div><div class="row sp"><span>Chênh lệch</span><b class="${d<0?'neg':'pos'}">${sum?(d>=0?'Thừa ':'Thiếu ')+money(Math.abs(d)):'—'}</b></div>`+(sum?denRows(c.expDen,a):'')}

function endChk(){const c=E_C,a=DV.end,sum=denSum(a);if(!c||!$('sDen'))return;
 if(sum){$('sAct').value=fmt(sum);endDiff(c.exp)}

function doEnd(exp){const a=$('sAct').value;if(a==='')return alert('Hãy nhập tiền mặt thực tế.');
 const sh={...S.shift,end:Date.now()},c=shiftCalc(sh);S.shifts.unshift({...sh,...c,act:num(a),diff:num(a)-exp,denEnd:{...DV.end}});S.shift=null;save();closeSheet();render();toast('Đã kết thúc ca')}

/* ===== Tổng quan tiền khách trả theo hình thức: tiền mặt / chuyển khoản / thẻ-ví ===== */
function payOverview(done){
 const m={cash:{n:0,v:0},bank:{n:0,v:0},card:{n:0,v:0}};let sp=0;
 /* x: cuốc hoặc đơn con. Đơn nửa tiền mặt/CK được chia vào hai dòng tiền mặt và chuyển khoản */
 const add=(x,tip)=>{
  if(x.pay==='split'){const q=splitOf(x,tip);m.cash.v+=q.c-q.ch;m.bank.v+=q.b;sp++}
  else if(m[x.pay]){m[x.pay].n++;m[x.pay].v+=x.due+(tip||0)}};
 done.forEach(t=>{
  if(t.subs)t.subs.forEach(x=>add(x,x.pay==='bank'?Math.max(0,(x.given||0)-x.due):0));else add(t,t.tip||0);
  if(t.tipOut)m.cash.v+=t.tipOut; // tip ngoài là tiền mặt
 });
 const tot=m.cash.v+m.bank.v+m.card.v,K3=['cash','bank','card'];
 return `<div class="card"><b>Tiền khách trả theo hình thức</b>`+K3.map(k=>`<div class="row sp" style="margin-top:10px"><span>${PAYS[k]} <span class="mu">· ${m[k].n} đơn</span></span><b>${money(m[k].v)}</b></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:${tot?m[k].v/tot*100:0}%"></i></div>`).join('')+
 `<div class="row sp" style="margin-top:10px"><span class="mu">Tổng</span><b>${money(tot)}</b></div>${sp?`<div class="mu" style="margin-top:4px;font-size:12px">Có ${sp} đơn nửa tiền mặt, nửa CK: đã chia vào hai dòng tiền mặt và chuyển khoản.</div>`:''}<div class="mu" style="margin-top:4px;font-size:12px">Gồm tiền phải thu + tip của khách. Tip ngoài tính vào tiền mặt.</div></div>`}

/* ===== Giữ màn hình luôn sáng (Screen Wake Lock) =====
   Trình duyệt tự nhả khoá khi chuyển tab/tắt màn hình, nên phải xin lại khi quay về. */
let WL=null;
async function wlOn(quiet){
 if(!('wakeLock' in navigator)){if(!quiet)toast('Trình duyệt này không hỗ trợ giữ sáng màn hình');return false}
 try{WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null});return true}
 catch(e){WL=null;if(!quiet)toast('Không bật được: trình duyệt chặn hoặc máy đang bật tiết kiệm pin');return false}}
function wlOff(){if(WL){WL.release().catch(()=>{});WL=null}}
async function toggleAwake(on){S.set.keepAwake=on;save();
 if(on){const ok=await wlOn();if(!ok){S.set.keepAwake=false;save()}else toast('Đã bật giữ màn hình sáng')}else{wlOff();toast('Đã tắt giữ màn hình sáng')}
 render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.set.keepAwake&&!WL)wlOn(true)});
document.addEventListener('pointerdown',()=>{if(S.set.keepAwake&&!WL)wlOn(true)},{passive:true}); // lúc mở app chưa xin được thì thử lại khi chạm

const WEEK_REWARDS={70:280000,110:500000,150:750000};
function weekProgress(now=Date.now()){
 const start=new Date(now);
 start.setHours(0,0,0,0);
 start.setDate(start.getDate()-(start.getDay()+6)%7);
 const end=new Date(start);
 end.setDate(end.getDate()+7);
 const count=S.trips.filter(t=>{
  if(t.status!=='done'||t.ts<+start||t.ts>=+end)return false;
  if(t.subs?.length)return t.subs.some(order=>(order.kind||t.type)==='food');
  return t.type==='bike'||t.type==='food';
 }).length;
 const goal=WEEK_REWARDS[S.set.weekGoal]?Number(S.set.weekGoal):70;
 const days=Math.max(1,7-(new Date(now).getDay()+6)%7);
 return {count,goal,remaining:Math.max(0,goal-count),days};
}

 (w.log.length?w.log.slice(0,200).map(l=>`<div class="card"><div class="row sp"><span>${esc(l.why)}</span><b class="${cls(l.amt)}">${l.amt>0?'+':''}${money(l.amt)}</b></div><div class="mu">${dt(l.ts)} · Số dư sau: ${money(l.bal)}</div></div>`).join(''):'<div class="card mu">Chưa có biến động.</div>')}
function walletForm(k){
 const T={topup:'Nạp tiền vào ví tín dụng',out:'Rút tiền từ ví tài xế',set:'Chỉnh số dư thủ công',xfer:'Chuyển từ ví tài xế sang ví tín dụng',bonus:'Nhập thưởng vào ví tài xế'};
 sheet(`<h2 style="margin-top:0">${T[k]}</h2><label>${k==='set'?'Số dư mới (có thể âm)':'Số tiền'}</label><input id="wA" type="text" class="mi" ${k==='set'?'inputmode="text" data-neg="1"':'inputmode="numeric"'}>
 <label>Ghi chú</label><input id="wN"><div class="row" style="margin-top:14px"><button class="f" onclick="closeSheet()">Đóng</button><button class="p f" onclick="walletDo('${k}')">Xác nhận</button></div>`)}
function walletDo(k){
 const raw=$('wA').value.trim(),v=val(raw),n=$('wN').value.trim();if(raw===''||raw==='-')return alert('Hãy nhập số tiền.');
 if(k!=='set'&&v<=0)return alert('Số tiền phải lớn hơn 0.');
 if(k==='topup')adj('credit',v,'Nạp tiền'+(n?': '+n:''));
 const run=()=>{if(k==='bonus')adj('driver',v,'Thưởng'+(n?': '+n:''));
  if(k==='xfer'){adj('driver',-v,'Chuyển sang ví tín dụng'+(n?': '+n:''));adj('credit',v,'Nhận từ ví tài xế'+(n?': '+n:''))}
  if(k==='out')adj('driver',-v,'Rút tiền'+(n?': '+n:''));
  if(k==='set')adj(wsel,v-S[wsel].bal,'Chỉnh số dư'+(n?': '+n:''));
  save();closeSheet();render()};
 if((k==='out'||k==='xfer')&&v>S.driver.bal)ask('Số tiền lớn hơn số dư ví tài xế. Vẫn tiếp tục?',run);else run()}

/* ================= THỐNG KÊ ================= */
function rangeDates(){
 const d=new Date(),k=x=>dkey(x);let from=F.from,to=F.to;
 if(!from&&!to){to=k(d);
  if(F.range==='day')from=to;
  else if(F.range==='week'){const w=new Date(d);w.setDate(d.getDate()-((d.getDay()+6)%7));from=k(w)}
  else from=k(new Date(d.getFullYear(),d.getMonth(),1))}
 return[from||'0000',to||'9999']}
function viewStats(){
 const[from,to]=rangeDates(),inR=x=>{const k=dkey(x.ts);return k>=from&&k<=to};
 const tr=S.trips.filter(t=>inR(t)&&(!F.type||t.type===F.type)&&(!F.pay||(t.subs?t.subs.some(x=>x.pay===F.pay):t.pay===F.pay))),done=tr.filter(t=>t.status==='done');
 window.__flt=tr.map(t=>t.id);
 const ex=S.exps.filter(inR).reduce((a,e)=>a+e.amt,0),sum=(a,f)=>a.reduce((s,t)=>s+f(t),0);
 const rev=sum(done,t=>t.due),bon=sum(done,t=>t.bonus||0),tip=sum(done,t=>t.tip||0),tipO=sum(done,t=>t.tipOut||0),net=sum(done,inc),fee=sum(done.filter(t=>t.type!=='ngoai'),t=>t.due-t.net);
 const bk=done.filter(t=>t.type==='bike'),bp=sum(bk,t=>t.due)?sum(bk,t=>t.due-t.net)/sum(bk,t=>t.due)*100:0;
 const cnt=Object.keys(TYPES).map(k=>TYPES[k]+': '+done.filter(t=>t.type===k).length).join(' · ');
 // Biểu đồ cột theo ngày (tối đa 31 ngày gần nhất trong khoảng)
 const days={};done.forEach(t=>{const k=dkey(t.ts);days[k]=(days[k]||0)+inc(t)});
 let ks=[];if(from!=='0000'&&to!=='9999'){for(let d=new Date(to+'T00:00');dkey(d)>=from&&ks.length<31;d.setDate(d.getDate()-1))ks.unshift(dkey(d))}else ks=Object.keys(days).sort().slice(-31);
 const mx=Math.max(1,...ks.map(k=>days[k]||0));
 const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
 return `<div class="seg t3" style="margin-bottom:8px">${[['day','Ngày'],['week','Tuần'],['month','Tháng']].map(([k,l])=>`<button class="${!F.from&&!F.to&&F.range===k?'on':''}" onclick="F.range='${k}';F.from=F.to='';render()">${l}</button>`).join('')}</div>
 <div class="card"><div class="row"><div style="flex:1"><label style="margin-top:0">Từ ngày</label><input type="date" value="${F.from}" onchange="F.from=this.value;render()"></div>
 <div style="flex:1"><label style="margin-top:0">Đến ngày</label><input type="date" value="${F.to}" onchange="F.to=this.value;render()"></div></div>
 <div class="row"><div style="flex:1"><label>Loại cuốc</label><select onchange="F.type=this.value;render()"><option value="">Tất cả</option>${opt(TYPES,F.type)}</select></div>
 <div style="flex:1"><label>Thanh toán</label><select onchange="F.pay=this.value;render()"><option value="">Tất cả</option>${opt(PAYS,F.pay)}</select></div></div></div>
 <div class="grid"><div class="card"><div class="mu">Doanh thu</div><b class="big" style="font-size:20px">${money(rev)}</b></div><div class="card"><div class="mu">Tổng phí</div><b class="big" style="font-size:20px">${money(fee)}</b></div>
 <div class="card"><div class="mu">Thực nhận</div><b class="big" style="font-size:20px">${money(net)}</b></div><div class="card"><div class="mu">Lợi nhuận sau chi phí</div><b class="big ${cls(net-ex)}" style="font-size:20px">${money(net-ex)}</b></div></div>
 <div class="card" style="margin-top:10px">Tiền thưởng cuốc (đã tính trong thực nhận): <b>${money(bon)}</b><br>Tip (đã tính trong thực nhận): <b>${money(tip)}</b><br>Tip ngoài (đã tính trong thực nhận): <b>${money(tipO)}</b><br>Chi phí: <b>${money(ex)}</b><br>Số cuốc hoàn thành: <b>${done.length}</b><br><span class="mu">${cnt}</span><br>Thu nhập TB/cuốc: <b>${money(done.length?net/done.length:0)}</b><br>% Grab lấy TB (Bike): <b>${bp.toFixed(1)}%</b> · % bạn nhận TB: <b>${bk.length?(100-bp).toFixed(1):0}%</b></div>
 ${payOverview(done)}
 <div class="card mu" style="font-size:13px;line-height:1.6"><b style="color:var(--tx)">Cách tính</b><br>
 • <b>Doanh thu</b> = cộng “tiền phải thu” của các cuốc hoàn thành (cuốc ngoài: số tiền khách trả) = ${money(rev)}<br>
 • <b>Tổng phí</b> = cộng (phải thu − ròng) của cuốc Bike/Food/Express = ${money(fee)} (có thể nhỏ hơn hoặc âm khi cuốc có voucher, vì Grab bù). Với Food/Mart/Express, tiền phải thu có thể gồm cả tiền món ứng cho quán nên số này có thể lớn hơn phí thật của Grab.<br>
 • <b>Thực nhận</b> = tiền ròng ${money(net-bon-tip-tipO)} + thưởng ${money(bon)} + tip ${money(tip)} + tip ngoài ${money(tipO)} = ${money(net)}<br>
 • <b>Lợi nhuận</b> = thực nhận − chi phí = ${money(net)} − ${money(ex)} = ${money(net-ex)}<br>
 • <b>Thu nhập TB/cuốc</b> = thực nhận ÷ số cuốc hoàn thành<br>
 • <b>% Grab lấy (Bike)</b> = tổng (phải thu − ròng) ÷ tổng phải thu × 100. <b>% bạn nhận</b> = 100% − % Grab lấy.</div>
 <h2>Thu nhập theo ngày</h2><div class="card">
 <div class="mu" id="cinfo" style="margin-bottom:8px">${ks.length?`Tổng <b>${money(ks.reduce((a,k)=>a+(days[k]||0),0))}</b> · TB mỗi ngày có chạy <b>${money(ks.filter(k=>days[k]).length?ks.reduce((a,k)=>a+(days[k]||0),0)/ks.filter(k=>days[k]).length:0)}</b><br>Chạm vào cột để xem chi tiết. Cột cam = ngày cao nhất.`:'Chưa có dữ liệu.'}</div>
 <div class="cw">${ks.map(k=>{const v=days[k]||0,wd=['CN','T2','T3','T4','T5','T6','T7'][new Date(k+'T00:00').getDay()];
  return `<div class="cc" onclick="$('cinfo').innerHTML='<b>${wd} ${k.slice(8)}/${k.slice(5,7)}</b>: ${money(v)}'"><span class="cv">${v?short(v):'–'}</span>
  <div class="cb"><i style="height:${v?Math.max(4,v/mx*100):0}%;${v&&v===mx?'background:var(--wa)':''}"></i></div><span class="cd">${k.slice(8)}/${k.slice(5,7)}</span><span class="cd" style="opacity:.7">${wd}</span></div>`}).join('')}</div></div>
 <div class="row sp"><h2>Danh sách cuốc (${tr.length})</h2>${tr.length?'<button class="s d" onclick="delFiltered()">Xoá danh sách này</button>':''}</div>`+(tr.length?tr.slice().sort((a,b)=>b.ts-a.ts||b.id-a.id).map(t=>tripCard(t)).join(''):'<div class="card mu">Không có cuốc phù hợp bộ lọc.</div>')+
 (S.shifts.length?'<h2>Các ca đã kết thúc</h2>'+S.shifts.slice(0,15).map(s=>`<div class="card">${dt(s.start)} → ${tm(s.end)} · ${s.n} cuốc<br>Thực nhận ${money(s.net)} · Lợi nhuận <b class="${cls(s.profit)}">${money(s.profit)}</b><br>Tiền mặt: dự kiến ${money(s.exp)}, thực tế ${money(s.act)} → <b class="${cls(s.diff)}">${s.diff>=0?'thừa':'thiếu'} ${money(Math.abs(s.diff))}</b>${denLines(s)}</div>`).join(''):'')}

/* ================= CÀI ĐẶT ================= */
function viewSet(){
 return `<div class="card"><label style="margin-top:0">Mục tiêu thu nhập mỗi ngày (đ)</label><input type="text" inputmode="numeric" class="mi" value="${fmt(S.set.goal)}" onchange="S.set.goal=num(this.value);save();toast('Đã lưu')">
 <div class="sw"><span>Cuốc tiền mặt/chuyển khoản: trừ tiền phải thu khỏi ví tín dụng</span><input type="checkbox" ${S.set.cashFee?'checked':''} onchange="S.set.cashFee=this.checked;save()"></div>
 <div class="sw"><span>Cuốc tiền mặt/chuyển khoản: cộng tiền ròng vào ví tài xế</span><input type="checkbox" ${S.set.cashNet?'checked':''} onchange="S.set.cashNet=this.checked;save()"></div>
 <div class="mu">Nếu ví tín dụng không đủ, phần thiếu tự trích từ ví tài xế. Thay đổi chỉ áp dụng cho cuốc lưu hoặc đổi trạng thái từ bây giờ. Cuốc cũ giữ nguyên cách đã tính.</div></div>
 <div class="card"><div class="sw"><span><b>Giữ màn hình luôn sáng</b><br><span class="mu">Màn hình không tự tắt khi app đang mở. Tốn pin hơn.</span></span><input type="checkbox" ${S.set.keepAwake?'checked':''} onchange="toggleAwake(this.checked)"></div></div>
 <div class="card"><b>Giao diện</b><div class="seg" style="margin-top:8px">${[['','Theo máy'],['light','Sáng'],['dark','Tối']].map(([k,l])=>`<button class="${S.set.theme===k?'on':''}" onclick="S.set.theme='${k}';save();theme();render()">${l}</button>`).join('')}</div></div>
 <div class="card"><b>Sao lưu dữ liệu</b>
 <div class="dash-actions dash-bottom"><button onclick="backup()">Tải bản sao JSON</button><button onclick="exportCSV()">Xuất CSV</button></div>
 <label for="restoreInput">Khôi phục từ tệp JSON</label><input id="restoreInput" type="file" accept=".json,application/json" onchange="restore(this.files[0]);this.value=''"></div>
 <div class="card"><b>Dữ liệu</b><button class="d" style="width:100%;margin-top:10px" onclick="delAllTrips()">Xoá toàn bộ lịch sử cuốc</button>
 <button class="d" style="width:100%;margin-top:10px" onclick="wipe()">Xoá toàn bộ dữ liệu</button></div>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportCSV(){
 const r=[['Thời gian','Loại','Thanh toán','Trạng thái','Phải thu','Ròng','Phí','Khách đưa','Ghi chú']];
 S.trips.forEach(t=>r.push([dt(t.ts),TYPES[t.type],PAYS[t.pay],STAT[t.status],t.due,t.net,t.type==='ngoai'?0:t.due-t.net,t.given,t.note]));
 r.push([]);r.push(['Chi phí']);S.exps.forEach(e=>r.push([dt(e.ts),e.note,e.amt,e.cash?'Tiền mặt':'Khác']));
 dl('grab-'+dkey(Date.now())+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function backup(){dl('grab-sao-luu-'+dkey(Date.now())+'.json',JSON.stringify(S),'application/json')}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.trips))throw 0;
 ask('Khôi phục sẽ ghi đè dữ liệu hiện tại. Tiếp tục?',()=>{localStorage.setItem(K,r.result);S=load();theme();render();toast('Đã khôi phục')})}catch(e){alert('File không hợp lệ.')}};r.readAsText(file)}
function wipe(){ask('Xoá TOÀN BỘ dữ liệu (cuốc, chi phí, ví, ca)? Không thể hoàn tác.',()=>
 ask('Chắc chắn xoá hết?',()=>{S=def();try{localStorage.removeItem(K)}catch(e){}save();F={from:'',to:'',type:'',pay:'',range:'day'};tab='home';theme();render();toast('Đã xoá toàn bộ dữ liệu')},'Xoá sạch'))}

/* ================= KHUNG CHÍNH ================= */
function theme(){const t=S.set.theme;if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function render(){
 const V={home:viewHome,wallet:viewWallet,stats:viewStats,set:viewSet};
 $('appDate').textContent=new Date().toLocaleDateString('vi-VN',{day:'numeric',month:'numeric'});
 $('app').innerHTML=V[tab]();
 $('startShiftButton')?.addEventListener('click',startShift);
 const cw=document.querySelector('.cw');if(cw)cw.scrollLeft=cw.scrollWidth; // cuộn tới ngày mới nhất
 $('fab').style.display=(tab==='home'||tab==='stats')?'':'none';
 $('nav').innerHTML=[['home','home','Hôm nay'],['wallet','wallet','Ví'],['stats','stats','Thống kê'],['set','settings','Cài đặt']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-${i}"/></svg>${l}</button>`).join('')}
theme();render();
if(S.set.keepAwake)wlOn(true);
</script>
</body>
</html>
